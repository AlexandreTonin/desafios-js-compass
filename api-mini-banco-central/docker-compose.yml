services:
  postgres:
    image: postgres:17
    container_name: api_mbc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: mbc
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - '5433:5432'
    volumes:
      - /var/lib/postgresql/data
volumes:
  postgres_data:
